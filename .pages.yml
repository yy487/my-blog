media:
  - name: images
    label: 图片
    input: public/uploads
    output: /uploads
    categories: [image]
  - name: patches
    label: 补丁文件
    input: public/downloads
    output: /downloads
    extensions: [zip, 7z, rar, gz, xz]

content:
  - name: posts
    label: 文章
    type: collection
    path: src/content/posts
    format: yaml-frontmatter
    subfolders: true
    filename:
      template: "{year}-{month}-{day}-{primary}.md"
      field: create
    fields:
      - name: title
        label: 标题
        type: string
        required: true
      - name: published
        label: 发布日期
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: draft
        label: 草稿（不在博客展示）
        type: boolean
        default: true
      - name: description
        label: 摘要
        type: text
      - name: image
        label: 封面图
        type: image
        options:
          media: images
      - name: tags
        label: 标签
        type: string
        list: true
      - name: category
        label: 分类
        type: string
      - name: lang
        label: 文章语言（留空使用站点语言）
        type: string
      - name: downloads
        label: 补丁下载
        description: 文件和外部链接可以二选一，也可同时填写。约20MB的补丁请先用本地「上传补丁」工具上传，再在这里选择。
        type: object
        list: true
        fields:
          - name: name
            label: 补丁名称（可包含版本）
            type: string
            required: true
          - name: file
            label: 补丁文件
            type: file
            options:
              media: patches
          - name: url
            label: 外部下载链接（http或https）
            type: string
          - name: note
            label: 补充说明（适用版本、提取码等）
            type: text
      - name: body
        label: 正文
        type: rich-text
        options:
          format: markdown
          switcher: true
          media: images

  - name: interactive
    label: 互动文章（MDX源码）
    type: collection
    path: src/content/posts
    format: code
    subfolders: true
    filename:
      template: "{year}-{month}-{day}-{primary}.mdx"
      field: create

  - name: about
    label: 关于页面
    type: file
    path: src/content/spec/about.md
    format: raw

  - name: site
    label: 站点设置
    type: file
    path: src/data/site.json
    format: json
    fields:
      - name: title
        label: 博客名称
        type: string
        required: true
      - name: subtitle
        label: 副标题
        type: string
      - name: name
        label: 昵称
        type: string
        required: true
      - name: bio
        label: 一句话简介
        type: text
      - name: avatar
        label: 头像
        type: image
        required: true
        options:
          media: images
      - name: hue
        label: 主题色相（蓝色为250）
        type: number
        required: true
        options:
          min: 0
          max: 360
      - name: walineServerURL
        label: 评论服务地址
        description: 填写部署好的 Waline HTTPS 地址；留空时保留分享，隐藏评论和点赞。
        type: string
      - name: walineTurnstileKey
        label: 评论验证码 Site Key（可选）
        description: 这里只填公开 Site Key；Secret Key 必须放在评论服务的环境变量中。
        type: string
